<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCab Basirpur</title>
</head>
<body style="margin:0;font-family:Arial;background:#f2f2f2">

<div style="background:#111;color:#fff;padding:12px;display:flex;align-items:center;gap:10px">
<div style="width:45px;height:45px;background:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #fff">CC</div>
<div><b>Chaudhry Cab - CCab</b><br><small style="font-size:11px">Basirpur & 65 Villages - Rs 100</small></div>
</div>

<div style="background:#fff;margin:10px;padding:12px;border-radius:10px">
<label>نام</label><br>
<input id="n" placeholder="احمد" style="width:95%;padding:10px;margin-top:5px"><br><br>

<label>کہاں سے</label><br>
<select id="f" style="width:100%;padding:10px;margin-top:5px">
<option>Basirpur</option><option>Ganda Singh گنڈا سنگھ</option><option>Tahir Kalan طاہرکلاں</option><option>Wanan Wala ونانوالہ</option><option>Muhammad Nagar محمد نگر</option><option>Tahir Khurd طاہر خورد</option><option>Kot Sher Khan کوٹ شیر خان</option><option>Chak 8/D چک 8 ڈی</option><option>Kalasan Hameed کلاسن حمید</option><option>Nihal Mahar نہال مہار</option><option>Rohela Tejeka روہیلہ تیجیکا</option><option>Ameera Tejeka امیرا تیجیکا</option><option>Qasim Ke قاسم کے</option><option>Mahar Daim Ke مہار دائم کے مہار</option><option>Azam Chowk اعظم چوک</option><option>Qari Chowk قاری چوک</option><option>Chah Chowki Wala چاہ چوکی والا</option><option>Manah Khagah منہ کھگھہ</option><option>Chowk Hafiz Lal چوک حافظ لال</option><option>Chak Hafiz چک حافظ</option><option>Lal Lalu لال لالو</option><option>Gadar Rahman گدڑ رحمان</option><option>Saonka سائونکا</option><option>Batak Lali Ke بٹک للی کے</option><option>Shahamand شہامند</option><option>Bharpur Shah بھرپور شاہ</option><option>Dighi Ahmed Yar ڈگھی احمد یار</option><option>Lari Adda Basirpur لاری اڈا</option><option>Railway Station ریلوے اسٹیشن</option><option>Mohalla Dars محلہ درس</option><option>Allama Iqbal Town علامہ اقبال ٹائون</option><option>Gali Postmaster والی گلی</option><option>Ghaus Pura غوث پورہ</option><option>Tariq Pura طارق پورہ</option><option>Thokar Gamman ٹھوکر گاماں</option><option>Chak Ahmed Shah چک احمد شاہ</option><option>Chak Ibrahim چک ابراہیم</option><option>Petrol Pump پٹرول پمپ</option><option>Khole Mureed کھولے مرید</option><option>Khole Jaimil کھولے جیمل</option><option>Sohag Pul سہاگ پل</option><option>Chak Bota چک بوٹا</option><option>Mahboob Shah محبوب شاہ</option><option>Turbat Shah Hussain تربت شاہ حسین</option><option>Marha مڑھا</option><option>Gilani Chowk گیلانی چوک</option><option>Gali Sheikhan Wali گلی شیخانوالی</option><option>Mohalla Exchange ایکسچینج</option>
</select><br><br>

<label>کہاں جانا ہے</label><br>
<select id="t" style="width:100%;padding:10px;margin-top:5px">
<option>Lahore لاہور</option><option>Okara اوکاڑہ</option><option>Sahiwal ساہیوال</option><option>Basirpur بصیرپور</option><option>Lari Adda لاری اڈا</option><option>Azam Chowk اعظم چوک</option><option>Qari Chowk قاری چوک</option><option>Gilani Chowk گیلانی چوک</option>
</select><br><br>

<div style="border:2px solid #16a34a;padding:10px;border-radius:10px;text-align:center;background:#f0fdf4">
<b>💰 کرایہ کم از کم 100 روپے</b>
<div id="rs" style="font-size:32px;font-weight:900;color:#16a34a">Rs 300</div>
<input type="range" id="r" min="100" max="10000" value="300" style="width:100%" oninput="document.getElementById('rs').innerText='Rs '+this.value;document.getElementById('rn').value=this.value">
<br><span style="font-size:11px">100 - 10000</span><br>
<input type="number" id="rn" value="300" min="100" style="width:80%;padding:8px;text-align:center;font-weight:800;border:2px solid #16a34a;margin-top:5px" oninput="document.getElementById('rs').innerText='Rs '+this.value;document.getElementById('r').value=this.value">
</div>

<br>
<button onclick="let f=document.getElementById('f').value,t=document.getElementById('t').value,n=document.getElementById('n').value||'Passenger',rs=document.getElementById('rn').value;window.open('https://wa.me/923000000000?text=CCab Booking%0AName:'+n+'%0AFrom:'+f+'%0ATo:'+t+'%0AFare:Rs'+rs,'_blank')" style="width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:10px;font-weight:800;font-size:16px">📲 رائیڈ بک کریں</button>

<button onclick="navigator.geolocation.getCurrentPosition(p=>{let f=document.getElementById('f').value,t=document.getElementById('t').value,n=document.getElementById('n').value||'Passenger',rs=document.getElementById('rn').value,link='https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude;window.open('https://wa.me/923000000000?text=CCab Live Location%0AName:'+n+'%0AFrom:'+f+'%0ATo:'+t+'%0AFare:Rs'+rs+'%0ALoc:'+link,'_blank')})" style="width:100%;padding:14px;background:#0ea5e9;color:#fff;border:0;border-radius:10px;font-weight:800;font-size:16px;margin-top:8px">📡 لوکیشن کے ساتھ بک کریں</button>

</div>

<div style="background:#fff;margin:10px;padding:12px;border-radius:10px">
<b>🚗 ڈرائیور بنیں</b><br>
<input id="dn" placeholder="نام" style="width:95%;padding:10px;margin-top:5px"><br>
<input id="dp" placeholder="فون 0300-1234567" style="width:95%;padding:10px;margin-top:5px"><br>
<button onclick="let n=document.getElementById('dn').value,p=document.getElementById('dp').value;if(!n||!p){alert('نام اور فون لکھیں');return}window.open('https://wa.me/923000000000?text=Driver Registration%0AName:'+n+'%0APhone:'+p,'_blank')" style="width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:8px">🚗 ڈرائیور رجسٹریشن</button>
<button onclick="navigator.geolocation.getCurrentPosition(pos=>{let n=document.getElementById('dn').value,p=document.getElementById('dp').value;if(!n||!p){alert('نام اور فون لکھیں');return}let link='https://maps.google.com/?q='+pos.coords.latitude+','+pos.coords.longitude;window.open('https://wa.me/923000000000?text=Driver Live Location%0AName:'+n+'%0APhone:'+p+'%0ALoc:'+link,'_blank')})" style="width:100%;padding:14px;background:#0ea5e9;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:8px">📡 ڈرائیور لوکیشن کے ساتھ</button>
</div>

<div style="background:#fff;margin:10px;padding:12px;border-radius:10px;text-align:center">
<b>🔧 ایڈمن</b><br>
<input id="ap" type="password" placeholder="ccab6974" style="width:95%;padding:10px;margin-top:5px"><br>
<button onclick="if(document.getElementById('ap').value==='ccab123'){alert('✅ ایڈمن لاگ ان کامیاب')}else{alert('غلط پاس ورڈ - ccab123')}" style="width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:8px">ایڈمن لاگ ان</button>
</div>

</body>
</html>
