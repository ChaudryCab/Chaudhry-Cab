<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCab - Basirpur</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f2f2}
.header{background:#111;color:#fff;padding:12px;display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;background:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:2px solid #fff}
.box{background:#fff;margin:10px;padding:14px;border-radius:12px}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:16px;margin-top:10px;color:#fff;cursor:pointer}
.green{background:#16a34a}.blue{background:#0ea5e9}.black{background:#111}
.fare{font-size:32px;font-weight:900;color:#16a34a;text-align:center}
</style>
</head>
<body>

<div class="header">
<div class="logo">CCab</div>
<div><b>Chaudhry Cab - CCab</b><br><small>Basirpur & 65+ Villages | Rs 100</small></div>

<label>کہاں جانا ہے</label>

<div style="border:2px solid #16a34a;border-radius:10px;padding:10px;text-align:center;background:#f0fdf4;margin-top:12px">
<b>💰 کرایہ کم از کم 100 روپے</b>
<div id="fareshow" class="fare">Rs 200</div>
<input type="range" id="farerange" min="100" max="10000" step="50" value="300" style="width:100%">
<div style="display:flex;justify-content:space-between;font-size:11px"><span>100</span><span>10000</span></div>
<input type="number" id="farenum" value="300" min="100" style="text-align:center;font-weight:800;border:2px solid #16a34a">
</div>

<button class="btn green" id="btnBook">📲 رائیڈ بک کریں</button>
<button class="btn blue" id="btnBookLoc">📡 لوکیشن کے ساتھ بک کریں</button>
<p id="pstatus" style="text-align:center;color:green;font-weight:700"></p>
</div>

<div class="box">
<b>🚗 ڈرائیور بنیں - مکمل تفصیل</b>
<input id="dname" placeholder="ڈرائیور نام * لازمی">
<input id="dphone" placeholder="فون نمبر * لازمی 0300..." style="margin-top:8px">
<input id="dlicense" placeholder="لائسنس نمبر * لازمی - مثال: DL-12345" style="margin-top:8px">
<input id="dvehicle" placeholder="گاڑی نمبر * لازمی - مثال: LEB-1234" style="margin-top:8px">
<select id="dcar" style="margin-top:8px"><option>Mehran / Alto</option><option>Cultus / WagonR</option><option>Corolla / City</option><option>APV / Carry</option><option>Bike / Rickshaw</option></select>
<button class="btn black" id="btnDriver">🚗 ڈرائیور رجسٹریشن بھیجیں</button>
<button class="btn blue" id="btnDriverLoc">📡 ڈرائیور لائیو لوکیشن + لائسنس + گاڑی نمبر</button>
<p id="dstatus" style="text-align:center;color:green;font-weight:700"></p>
</div>

<div class="box" style="text-align:center">
<b>🔧 ایڈمن</b>
<input id="apass" type="password" placeholder="ccab123" style="margin-top:8px">
<button class="btn black" id="btnAdmin">ایڈمن لاگ ان</button>
<p id="astatus" style="font-size:12px;color:#666">ccab123</p>
</div>

<script>
let fare=300;
const rg=document.getElementById('farerange'),nm=document.getElementById('farenum'),sh=document.getElementById('fareshow');
function sync(v){fare=parseInt(v)||100;if(fare<100)fare=100;rg.value=fare;nm.value=fare;sh.innerText='Rs '+fare;}
rg.addEventListener('input',e=>sync(e.target.value));
nm.addEventListener('input',e=>sync(e.target.value));

document.getElementById('btnBook').addEventListener('click',()=>{
let n=document.getElementById('pname').value||'Passenger',f=document.getElementById('pfrom').value,t=document.getElementById('pto').value;
window.open('https://wa.me/923000000000?text=CCab Booking%0AName:'+n+'%0AFrom:'+f+'%0ATo:'+t+'%0AFare:Rs'+fare,'_blank');
});

s.innerText='✅ ہو گیا';
});
});

if(!n||!ph||!lic||!veh){alert('نام، فون، لائسنس نمبر، گاڑی نمبر چاروں لازمی ہیں');return;}

document.getElementById('btnDriverLoc').addEventListener('click',()=>{
let s=document.getElementById('dstatus');s.innerText='لوکیشن...';
navigator.geolocation.getCurrentPosition(p=>{
let n=document.getElementById('dname').value,ph=document.getElementById('dphone').value,lic=document.getElementById('dlicense').value,veh=document.getElementById('dvehicle').value,car=document.getElementById('dcar').value;

s.innerText='✅ ہو گیا';
});
});
