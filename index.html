<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaudhry Cab - CCab</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: #f4f6f9; color: #333; padding-bottom: 30px; }
  
  .header {
    background: linear-gradient(135deg, #111827, #064e3b);
    color: white;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .logo-box {
    width: 55px;
    height: 55px;
    background: #16a34a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    color: #fff;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .header-info h1 { font-size: 20px; color: #4ade80; margin-bottom: 2px; }
  .header-info p { font-size: 12px; color: #e5e7eb; }

  .banner-container {
    width: 100%;
    background: #e5e7eb;
    text-align: center;
    overflow: hidden;
  }
  .banner-container img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
  }

  .nav-tabs {
    display: flex;
    background: #fff;
    border-bottom: 2px solid #e5e7eb;
    margin-bottom: 15px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    background: none;
    border: none;
    font-weight: bold;
    font-size: 15px;
    color: #4b5563;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active {
    color: #16a34a;
    border-bottom: 3px solid #16a34a;
    background: #f0fdf4;
  }

  .container { padding: 0 12px; max-width: 600px; margin: 0 auto; }
  .box {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 15px;
  }
  .box-title {
    font-size: 17px;
    font-weight: bold;
    color: #111827;
    margin-bottom: 12px;
    border-right: 4px solid #16a34a;
    padding-right: 8px;
  }

  label { font-size: 13px; font-weight: 600; color: #374151; margin-top: 10px; display: block; }
  input, select {
    width: 100%;
    padding: 11px;
    margin-top: 5px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    background: #f9fafb;
    outline: none;
  }
  input:focus, select:focus { border-color: #16a34a; background: #fff; }

  .btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    margin-top: 12px;
    color: #fff;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-green { background: #16a34a; }
  .btn-green:hover { background: #15803d; }
  .btn-blue { background: #0284c7; }
  .btn-blue:hover { background: #0369a1; }
  .btn-black { background: #1f2937; }
  .btn-black:hover { background: #111827; }

  .fare-box {
    border: 2px dashed #16a34a;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    background: #f0fdf4;
    margin-top: 15px;
  }
  .fare-title { font-size: 13px; color: #166534; font-weight: bold; }
  .fare-display { font-size: 28px; font-weight: 900; color: #16a34a; margin: 4px 0; }

  #map { height: 200px; width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #ccc; }
  .status-msg { text-align: center; font-size: 13px; font-weight: bold; margin-top: 8px; color: #16a34a; }
  
  .card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
    font-size: 13px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-box">CCab</div>
  <div class="header-info">
    <h1>Chaudhry Cab (CCab)</h1>
    <p>بصیرپور اور گردونواح کے تمام دیہات و شہر | 24/7 سروس</p>
  </div>
</div>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('passengerTab')">پسنجر بکنگ</button>
  <button class="tab-btn" onclick="switchTab('driverTab')">ڈرائیور پورٹل</button>
  <button class="tab-btn" onclick="switchTab('adminTab')">ایڈمن</button>
</div>

<div class="container">

  <!-- PASSENGER TAB -->
  <div id="passengerTab">
    <div class="box">
      <div class="box-title">📲 رائیڈ بک کریں</div>
      
      <label>آپ کا نام</label>
      <input type="text" id="pname" placeholder="مثال: احمد خان">

      <label>پک اپ لوکیشن (کہاں سے)</label>
      <select id="pfrom"></select>

      <label>ڈراپ آف لوکیشن (کہاں جانا ہے)</label>
      <select id="pto"></select>

      <div class="fare-box">
        <div class="fare-title">💰 کرایہ کی پیشکش (کم از کم 100 روپے)</div>
        <div id="fareshow" class="fare-display">Rs 300</div>
        <input type="range" id="farerange" min="100" max="5000" step="50" value="300">
        <input type="number" id="farenum" value="300" min="100" style="text-align:center; font-weight:bold; margin-top:5px;">
      </div>

      <button class="btn btn-green" id="btnBook">ڈرائیور سے رابطہ کریں (WhatsApp)</button>
      <button class="btn btn-blue" id="btnGetLoc">📡 میری لائیو لوکیشن دکھائیں</button>
      <div id="map"></div>
      <p id="pstatus" class="status-msg"></p>
    </div>

    <div class="box">
      <div class="box-title">🚗 دستیاب آن لائن ڈرائیورز</div>
      <div id="onlineDriversList"><p style="font-size:12px; color:#666;">کوئی آن لائن ڈرائیور موجود نہیں ہے۔</p></div>
    </div>
  </div>

  <!-- DRIVER TAB -->
  <div id="driverTab" class="hidden">
    <div class="box">
      <div class="box-title">🚗 ڈرائیور رجسٹریشن و لاگ ان</div>
      
      <label>ڈرائیور کا نام *</label>
      <input type="text" id="dname" placeholder="محمد علی">

      <label>موبائل نمبر / WhatsApp *</label>
      <input type="tel" id="dphone" placeholder="03001234567">

      <label>لائسنس نمبر *</label>
      <input type="text" id="dlicense" placeholder="DL-98765">

      <label>گاڑی نمبر *</label>
      <input type="text" id="dvehicle" placeholder="LEB-5678">

      <label>گاڑی کی قسم *</label>
      <select id="dcar">
        <option>مہران / الٹو (Mehran / Alto)</option>
        <option>کلٹس / ویگن آر (Cultus / WagonR)</option>
        <option>کرولا / سٹی (Corolla / City)</option>
        <option>بائیک / رکشہ (Bike / Rickshaw)</option>
      </select>

      <button class="btn btn-black" id="btnRegisterDriver">ڈرائیور رجسٹر کریں</button>
      <button class="btn btn-blue" id="btnDriverOnline">📡 آن لائن ہوں / لائیو لوکیشن اپڈیٹ کریں</button>
      <p id="dstatus" class="status-msg"></p>
    </div>
  </div>

  <!-- ADMIN TAB -->
  <div id="adminTab" class="hidden">
    <div class="box">
      <div class="box-title">🔒 ایڈمن پینل</div>
      <label>ایڈمن پاس ورڈ درج کریں</label>
      <input type="password" id="apass" placeholder="پاس ورڈ درج کریں">
      <button class="btn btn-black" id="btnAdminLogin">لاگ ان کریں</button>
      <p id="astatus" class="status-msg"></p>
    </div>

    <div id="adminContent" class="hidden">
      <div class="box">
        <div class="box-title">📊 تمام پسنجر بکنگز</div>
        <div id="adminBookings"></div>
      </div>
      <div class="box">
        <div class="box-title">🚘 تمام رجسٹرڈ ڈرائیورز</div>
        <div id="adminDrivers"></div>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const locations = [
  "Basirpur بصیرپور", "Ganda Singh گنڈا سنگھ", "Tahir Kalan طاہرکلاں", "Wanan Wala ونانوالہ", 
  "Muhammad Nagar محمد نگر", "Tahir Khurd طاہر خورد", "Kot Sher Khan کوٹ شیر خان", "Chak 8/D چک 8 ڈی", 
  "Kalasan Hameed کلاسن حمید", "Nihal Mahar نہال مہار", "Rohela Tejeka روہیلہ تیجیکا", "Ameera Tejeka امیرا تیجیکا", 
  "Qasim Ke قاسم کے", "Mahar Daim Ke Mahar مہار دائم کے مہار", "Azam Chowk اعظم چوک", "Qari Chowk قاری چوک", 
  "Chah Chowki Wala چاہ چوکی والا", "Manah Khagah منہ کھگھہ", "Chowk Hafiz Lal چوک حافظ لال", "Chak Hafiz چک حافظ", 
  "Lal Lalu لال لالو", "Gadar Rahman گدڑ رحمان", "Saonka سائونکا", "Batak Lali Ke بٹک للی کے", 
  "Shahamand شہامند", "Bharpur Shah بھرپور شاہ", "Dighi Ahmed Yar ڈگھی احمد یار", "Lari Adda Basirpur لاری اڈا", 
  "Railway Station ریلوے اسٹیشن", "Mohalla Dars محلہ درس", "Allama Iqbal Town علامہ اقبال ٹائون", 
  "Gali Postmaster والی گلی", "Ghaus Pura غوث پورہ", "Tariq Pura طارق پورہ", "Thokar Gamman ٹھوکر گاماں", 
  "Chak Ahmed Shah چک احمد شاہ", "Chak Ibrahim چک ابراہیم", "Petrol Pump پٹرول پمپ", "Khole Mureed کھولے مرید", 
  "Khole Jaimil کھولے جیمل", "Sohag Pul سہاگ پل", "Chak Bota چک بوٹا", "Mahboob Shah محبوب شاہ", 
  "Gilani Chowk گیلانی چوک", "Mohalla Exchange ایکسچینج", 
  "Depalpur دیپالپور", "Hujra Shah Muqaam حجرہ شاہ مقیم", "Haveli Lakha حویلی لکھا", "Okara اوکاڑہ", 
  "Mandi Ahmad Abad منڈی احمد آباد", "Sahiwal ساہیوال", "Kasur قصور", "Lahore لاہور"
];

function populateSelects() {
  const pfrom = document.getElementById('pfrom');
  const pto = document.getElementById('pto');
  locations.forEach(loc => {
    pfrom.add(new Option(loc, loc));
    pto.add(new Option(loc, loc));
  });
}
populateSelects();

let fare = 300;
const rg = document.getElementById('farerange'), nm = document.getElementById('farenum'), sh = document.getElementById('fareshow');
function syncFare(v) {
  fare = parseInt(v) || 100;
  if(fare < 100) fare = 100;
  rg.value = fare; nm.value = fare; sh.innerText = 'Rs ' + fare;
}
rg.addEventListener('input', e => syncFare(e.target.value));
nm.addEventListener('input', e => syncFare(e.target.value));

function switchTab(tabId) {
  ['passengerTab', 'driverTab', 'adminTab'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(tabId).classList.remove('hidden');
  
  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  if(tabId==='passengerTab') buttons[0].classList.add('active');
  if(tabId==='driverTab') buttons[1].classList.add('active');
  if(tabId==='adminTab') buttons[2].classList.add('active');

  if(tabId === 'passengerTab') loadOnlineDrivers();
}

let map, marker, userLat, userLng;
function initMap() {
  map = L.map('map').setView([30.5786, 73.8385], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}
initMap();

document.getElementById('btnGetLoc').addEventListener('click', () => {
  const status = document.getElementById('pstatus');
  status.innerText = "لوکیشن حاصل کی جا رہی ہے...";
  if(navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(p => {
      userLat = p.coords.latitude;
      userLng = p.coords.longitude;
      map.setView([userLat, userLng], 15);
      if(marker) map.removeLayer(marker);
      marker = L.marker([userLat, userLng]).addTo(map).bindPopup("آپ کی لائیو لوکیشن").openPopup();
      status.innerText = "✅ لوکیشن حاصل کر لی گئی ہے!";
    }, () => { status.innerText = "❌ لوکیشن حاصل کرنے میں ناکامی ہوئی۔"; });
  }
});

document.getElementById('btnBook').addEventListener('click', () => {
  const name = document.getElementById('pname').value || 'پسنجر';
  const from = document.getElementById('pfrom').value;
  const to = document.getElementById('pto').value;
  let locLink = userLat ? `https://maps.google.com/?q=${userLat},${userLng}` : 'فراہم نہیں کی گئی';

  const booking = { id: Date.now(), name, from, to, fare, locLink, status: 'Pending' };
  let bookings = JSON.parse(localStorage.getItem('ccab_bookings') || '[]');
  bookings.push(booking);
  localStorage.setItem('ccab_bookings', JSON.stringify(bookings));

  const text = `CCab Booking%0AName: ${name}%0AFrom: ${from}%0ATo: ${to}%0AFare: Rs ${fare}%0ALocation: ${locLink}`;
  window.open(`https://wa.me/923000000000?text=${text}`, '_blank');
});

document.getElementById('btnRegisterDriver').addEventListener('click', () => {
  const name = document.getElementById('dname').value;
  const phone = document.getElementById('dphone').value;
  const lic = document.getElementById('dlicense').value;
  const veh = document.getElementById('dvehicle').value;
  const car = document.getElementById('dcar').value;

  if(!name || !phone || !lic || !veh) {
    alert('تمام خانے پُر کرنا لازمی ہیں!');
    return;
  }

  let drivers = JSON.parse(localStorage.getItem('ccab_drivers') || '[]');
  const exists = drivers.find(d => d.phone === phone);
  if(!exists) {
    drivers.push({ name, phone, lic, veh, car, online: false });
    localStorage.setItem('ccab_drivers', JSON.stringify(drivers));
    document.getElementById('dstatus').innerText = "✅ رجسٹریشن کامیاب ہو گئی!";
  } else {
    document.getElementById('dstatus').innerText = "✅ ڈرائیور پہلے سے رجسٹرڈ ہے۔";
  }
});

document.getElementById('btnDriverOnline').addEventListener('click', () => {
  const phone = document.getElementById('dphone').value;
  if(!phone) { alert('براہ کرم اپنا موبائل نمبر درج کریں!'); return; }

  let drivers = JSON.parse(localStorage.getItem('ccab_drivers') || '[]');
  let d = drivers.find(drv => drv.phone === phone);

  if(d) {
    if(navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(p => {
        d.online = true;
        d.lat = p.coords.latitude;
        d.lng = p.coords.longitude;
        localStorage.setItem('ccab_drivers', JSON.stringify(drivers));
        document.getElementById('dstatus').innerText = "✅ آپ آن لائن ہیں اور لوکیشن شیئر ہو گئی ہے!";
      });
    }
  } else {
    alert('پہلے ڈرائیور رجسٹریشن کریں!');
  }
});

function loadOnlineDrivers() {
  const list = document.getElementById('onlineDriversList');
  let drivers = JSON.parse(localStorage.getItem('ccab_drivers') || '[]');
  const online = drivers.filter(d => d.online);

  if(online.length === 0) {
    list.innerHTML = `<p style="font-size:12px; color:#666;">اس وقت کوئی ڈرائیور آن لائن نہیں ہے۔</p>`;
    return;
  }

  list.innerHTML = online.map(d => `
    <div class="card">
      <b>${d.name}</b> (${d.car})<br>
      گاڑی نمبر: ${d.veh}<br>
      <a href="https://wa.me/${d.phone.replace(/^0/, '92')}" target="_blank" style="color:#16a34a; font-weight:bold;">💬 WhatsApp پر ڈرائیور سے رابطہ کریں</a>
    </div>
  `).join('');
}

document.getElementById('btnAdminLogin').addEventListener('click', () => {
  const pass = document.getElementById('apass').value;
  const status = document.getElementById('astatus');
  
  if(pass === 'ccab6974') {
    status.innerText = "✅ ایڈمن لاگ ان کامیاب!";
    status.style.color = "green";
    document.getElementById('adminContent').classList.remove('hidden');
    loadAdminData();
  } else {
    status.innerText = "❌ غلط پاس ورڈ!";
    status.style.color = "red";
  }
});

function loadAdminData() {
  const bList = document.getElementById('adminBookings');
  let bookings = JSON.parse(localStorage.getItem('ccab_bookings') || '[]');
  bList.innerHTML = bookings.length ? bookings.map(b => `
    <div class="card">
      <b>پسنجر:</b> ${b.name} | <b>کرایہ:</b> Rs ${b.fare}<br>
      <b>کہاں سے:</b> ${b.from} ➔ <b>کہاں:</b> ${b.to}<br>
      <a href="${b.locLink}" target="_blank">📍 لوکیشن دیکھیں</a>
    </div>
  `).join('') : '<p>کوئی بکنگ موجود نہیں ہے۔</p>';

  const dList = document.getElementById('adminDrivers');
  let drivers = JSON.parse(localStorage.getItem('ccab_drivers') || '[]');
  dList.innerHTML = drivers.length ? drivers.map(d => `
    <div class="card">
      <b>نام:</b> ${d.name} (${d.phone})<br>
      <b>گاڑی:</b> ${d.car} (${d.veh}) | <b>لائسنس:</b> ${d.lic}<br>
      <b>سٹیٹس:</b> ${d.online ? '🟢 آن لائن' : '🔴 آف لائن'}
    </div>
  `).join('') : '<p>کوئی ڈرائیور رجسٹرڈ نہیں ہے۔</p>';
}
</script>
</body>
</html>
